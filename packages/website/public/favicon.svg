<?xml version="1.0" encoding="UTF-8"?>
<!--
  Thinkite app icon — master (square, full-bleed, NO rounded corners)
  iOS/Expo consume this directly; all raster exports derive from it.

  Geometry (base 200 grid, scaled x5.12):
    V  (32,172)   kite vertex, inset from bottom-left
    A  (84,0)     spine exit on top edge
    C  (200,0)    implied 4th vertex = top-right corner (off-frame)
    B  (200,132)  crossbar exit on right edge
    X  (138.94,62.52) spar intersection (spine V-C × crossbar A-B)
  Palette: sunrise v2 (peach/gold/rose/lavender) on clear-sky blue
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#CFE6F5"/>
  <polygon points="163.84,880.64 430.08,0 711.36,320.08" fill="#EE8A57"/>
  <polygon points="430.08,0 1024,0 711.36,320.08" fill="#F6C67D"/>
  <polygon points="1024,0 1024,675.84 711.36,320.08" fill="#DB6480"/>
  <polygon points="163.84,880.64 711.36,320.08 1024,675.84" fill="#7A63AC"/>
</svg>
